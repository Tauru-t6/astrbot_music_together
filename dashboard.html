<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Music Together · 陪伴面板</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2330;
    --line: #2b3342;
    --fg: #e6edf3;
    --dim: #8b98a9;
    --accent: #a78bfa;
    --accent2: #67e8f9;
    --good: #4ade80;
    --bad: #f87171;
    --idle: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #1b1430 0%, var(--bg) 55%);
    color: var(--fg);
    font: 14px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    padding: 24px;
  }
  .wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }

  header.brand { display: flex; align-items: center; gap: 12px; }
  .disc {
    width: 46px; height: 46px; border-radius: 50%;
    background: conic-gradient(var(--accent), var(--accent2), var(--accent));
    display: grid; place-items: center;
    animation: spin 6s linear infinite paused;
    box-shadow: 0 0 24px #a78bfa44;
  }
  .disc::after {
    content: ""; width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg);
  }
  body.playing .disc { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  header.brand h1 { font-size: 18px; font-weight: 600; }
  header.brand p { color: var(--dim); font-size: 12px; }

  .card {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
  }

  .status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .dot.off { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
  .dot.wait { background: var(--idle); box-shadow: 0 0 8px var(--idle); }
  .pill {
    font-size: 12px; color: var(--dim);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 10px;
  }
  .pill b { color: var(--fg); font-weight: 500; }

  .now { display: flex; gap: 16px; align-items: center; }
  .cover {
    width: 88px; height: 88px; border-radius: 10px; object-fit: cover;
    background: var(--panel2); border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .now .meta { min-width: 0; flex: 1; }
  .now .title { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .artist { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .now .empty { color: var(--dim); padding: 8px 0; }

  .bar { margin-top: 12px; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar > i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .5s linear;
  }
  .time { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .paused-tag { color: var(--idle); font-size: 12px; }

  h2 { font-size: 13px; color: var(--dim); font-weight: 500; margin-bottom: 10px; letter-spacing: .06em; }
  ul.feed { list-style: none; display: grid; gap: 6px; max-height: 300px; overflow: auto; }
  ul.feed li {
    display: flex; gap: 10px; font-size: 13px;
    padding: 6px 10px; border-radius: 8px; background: #ffffff06;
  }
  ul.feed .t { color: var(--dim); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  ul.feed .k { flex-shrink: 0; }
  ul.feed .k.danmaku { color: var(--accent2); }
  ul.feed .k.chat { color: var(--accent); }
  ul.feed .k.sys { color: var(--dim); }
  ul.feed .x { word-break: break-all; }

  footer { color: var(--dim); font-size: 12px; text-align: center; }
  footer code { color: var(--accent2); }

  details.settings summary {
    cursor: pointer; color: var(--dim); font-size: 13px;
    letter-spacing: .06em; list-style: none; user-select: none;
  }
  details.settings summary::before { content: "⚙ "; }
  details.settings[open] summary { margin-bottom: 12px; color: var(--fg); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .grid .full { grid-column: 1 / -1; }
  label.f { display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
  label.f input, label.f textarea, label.f select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    color: var(--fg); padding: 8px 10px; font: inherit; width: 100%;
  }
  label.f textarea { min-height: 76px; resize: vertical; }
  label.f input:focus, label.f textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  button.save {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #0d1117; border: 0; border-radius: 8px; font-weight: 600;
    padding: 8px 18px; cursor: pointer;
  }
  button.save:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 12px; color: var(--dim); }
  #saveMsg { font-size: 12px; color: var(--good); }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg); }
  .chk input { accent-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="disc" aria-hidden="true"></div>
    <div>
      <h1>Music Together · 陪伴面板</h1>
      <p id="sub">正在连接…</p>
    </div>
  </header>

  <section class="card status" id="statusCard">
    <span class="dot off" id="connDot"></span>
    <span id="connText">未连接</span>
    <span class="pill">房间 <b id="room">—</b></span>
    <span class="pill">昵称 <b id="nick">—</b></span>
  </section>

  <section class="card">
    <h2>正在听</h2>
    <div class="now" id="nowPlaying">
      <div class="empty">暂时没有正在播放的歌曲</div>
    </div>
    <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
    <div class="time" id="timeRow" hidden>
      <span id="tCur">0:00</span><span class="paused-tag" id="pausedTag" hidden>已暂停</span><span id="tTotal">0:00</span>
    </div>
  </section>

  <section class="card">
    <h2>最近弹幕 / 动态</h2>
    <ul class="feed" id="feed"></ul>
  </section>

  <section class="card">
    <details class="settings" id="settingsBox">
      <summary>设置(模型 / 人设 / 节奏)</summary>
      <div class="grid">
        <label class="f full">Gemini 端点
          <input id="f_endpoint" placeholder="https://…/v1beta/models/{model}:generateContent"></label>
        <label class="f">模型名
          <input id="f_model" placeholder="gemini-2.5-flash"></label>
        <label class="f">API Key
          <input id="f_key" type="password" placeholder="不修改请留空"></label>
        <label class="f">片段长度(秒)
          <input id="f_seg" type="number" min="10" max="180" step="1"></label>
        <label class="f">提前分析(秒)
          <input id="f_lead" type="number" min="0" max="60" step="1"></label>
        <label class="f">Bot 昵称
          <input id="f_nick"></label>
        <label class="f">HTTP 代理(可空)
          <input id="f_proxy" placeholder="http://127.0.0.1:7890"></label>
        <label class="f full">人设 prompt
          <textarea id="f_persona"></textarea></label>
        <label class="f">会话桶(chat_session_id)
          <input id="f_chat_session" placeholder="music-room 或 Tauru:FriendMessage:xxx"></label>
        <label class="f">平台 ID(chat_platform_id)
          <input id="f_chat_platform" placeholder="Tauru"></label>
        <label class="f chk full"><input id="f_reply_all" type="checkbox"> 回应房间里所有聊天(关闭则仅 @ 或含昵称)</label>
      </div>
      <div class="row">
        <button class="save" id="saveBtn">保存并热生效</button>
        <span id="saveMsg"></span>
        <span class="hint">改动立即生效并持久化到插件数据目录,重启不丢。</span>
      </div>
    </details>
  </section>

  <footer>每 3 秒自动刷新 · <code>/api/status</code> · <code>/api/config</code></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (s) => {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function refresh() {
  let d;
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    d = await r.json();
  } catch {
    $("connDot").className = "dot off";
    $("connText").textContent = "面板服务异常";
    return;
  }

  $("connDot").className = "dot " + (d.connected ? "on" : "off");
  $("connText").textContent = d.connected ? "已连接房间服务" : "未连接";
  $("room").textContent = d.room_id || "—";
  $("nick").textContent = d.nickname || "—";
  $("sub").textContent = d.listening
    ? (d.paused ? "陪你听到一半暂停了" : "正在陪你一起听")
    : "待命中，去房间点首歌吧";

  const np = $("nowPlaying");
  document.body.classList.toggle("playing", d.listening && !d.paused);
  if (d.listening && d.track && d.track.title) {
    np.innerHTML =
      (d.track.cover ? `<img class="cover" src="${esc(d.track.cover)}" alt="">`
                     : `<div class="cover"></div>`) +
      `<div class="meta"><div class="title">${esc(d.track.title)}</div>` +
      `<div class="artist">${esc(d.track.artist || "未知艺术家")}</div></div>`;
    $("barWrap").hidden = false;
    $("timeRow").hidden = false;
    const pct = d.duration ? Math.min(100, d.position / d.duration * 100) : 0;
    $("bar").style.width = pct + "%";
    $("tCur").textContent = fmt(d.position);
    $("tTotal").textContent = fmt(d.duration);
    $("pausedTag").hidden = !d.paused;
  } else {
    np.innerHTML = `<div class="empty">暂时没有正在播放的歌曲</div>`;
    $("barWrap").hidden = true;
    $("timeRow").hidden = true;
  }

  const feed = $("feed");
  const items = (d.events || []).slice().reverse();
  feed.innerHTML = items.length
    ? items.map((e) => {
        const t = new Date(e.ts * 1000);
        const hh = String(t.getHours()).padStart(2, "0");
        const mm = String(t.getMinutes()).padStart(2, "0");
        const ss = String(t.getSeconds()).padStart(2, "0");
        return `<li><span class="t">${hh}:${mm}:${ss}</span>` +
               `<span class="k ${esc(e.kind)}">${e.kind === "danmaku" ? "弹幕" : e.kind === "chat" ? "聊天" : "系统"}</span>` +
               `<span class="x">${esc(e.text)}</span></li>`;
      }).join("")
    : `<li><span class="x" style="color:var(--dim)">还没有动态</span></li>`;
}

refresh();
setInterval(refresh, 3000);

// ---- settings ----
const FIELD_MAP = {
  f_endpoint: "gemini_endpoint",
  f_model: "gemini_model",
  f_key: "gemini_key",
  f_seg: "segment_seconds",
  f_lead: "analyze_lead_seconds",
  f_nick: "nickname",
  f_proxy: "proxy",
  f_persona: "persona",
  f_chat_session: "chat_session_id",
  f_chat_platform: "chat_platform_id",
};

async function loadConfig() {
  try {
    const r = await fetch("/api/config", { cache: "no-store" });
    const cfg = await r.json();
    for (const [id, key] of Object.entries(FIELD_MAP)) {
      const el = $(id);
      if (el && cfg[key] !== undefined) el.value = cfg[key];
    }
    $("f_reply_all").checked = !!cfg.reply_all_chat;
  } catch { /* panel without config API */ }
}

$("saveBtn").addEventListener("click", async () => {
  const btn = $("saveBtn"), msg = $("saveMsg");
  btn.disabled = true;
  msg.textContent = "";
  const payload = { reply_all_chat: $("f_reply_all").checked };
  for (const [id, key] of Object.entries(FIELD_MAP)) {
    const el = $(id);
    if (!el) continue;
    if (key === "gemini_key" && (!el.value || el.value === "********")) continue;
    if (["segment_seconds", "analyze_lead_seconds"].includes(key)) {
      payload[key] = parseFloat(el.value);
    } else {
      payload[key] = el.value;
    }
  }
  try {
    const r = await fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    msg.textContent = "已保存并生效 ✓";
    setTimeout(() => (msg.textContent = ""), 3000);
  } catch (e) {
    msg.style.color = "var(--bad)";
    msg.textContent = "保存失败:" + e.message;
    setTimeout(() => { msg.style.color = "var(--good)"; }, 3200);
  } finally {
    btn.disabled = false;
  }
});

loadConfig();
</script>
</body>
</html>
